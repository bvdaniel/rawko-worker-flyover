<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rawko Flyover</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <style>
      /* ===== Tokens ===== */
      :root {
        --bg-velo: #0C0E12;
        --texto: #F2EFE8;
        --muted: #8F979F;
        --acento: #E0A01A;
      }

      @font-face {
        font-family: 'Satoshi';
        src: url('/fonts/satoshi/Satoshi-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Satoshi';
        src: url('/fonts/satoshi/Satoshi-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Satoshi';
        src: url('/fonts/satoshi/Satoshi-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Satoshi';
        src: url('/fonts/satoshi/Satoshi-Black.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Satoshi', system-ui, -apple-system, sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--texto);
        background: #000;
      }
      #map { position: absolute; inset: 0; width: 100%; height: 100%; }

      .overlay {
        position: absolute;
        pointer-events: none;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .overlay.visible { opacity: 1; }

      /* ===== Logo (wordmark sans, sin mark ni itálica) ===== */
      .logo {
        display: inline-flex;
        align-items: baseline;
        font-family: 'Satoshi', system-ui, sans-serif;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.02em;
      }

      /* ===== Eyebrow PATAGONIA ===== */
      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.22em;
        color: var(--acento);
        text-transform: uppercase;
      }
      .eyebrow::before, .eyebrow::after {
        content: '';
        width: 56px;
        height: 2px;
        background: var(--acento);
        flex-shrink: 0;
      }

      /* ===== 1. TÍTULO (intro) ===== */
      .intro {
        inset: 0;
      }
      .intro-eyebrow {
        position: absolute;
        top: 340px;
        left: 0; right: 0;
      }
      .intro-title-wrap {
        position: absolute;
        left: 32px;
        right: 32px;
        top: 480px;
        text-align: center;
      }
      .intro-title {
        margin: 0;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.1;
        color: var(--texto);
      }
      .intro-date {
        margin-top: 18px;
        font-size: 32px;
        font-weight: 500;
        color: var(--muted);
      }

      /* Círculo de inicio de ruta (posicionado por animation.js) */
      #startDot {
        position: absolute;
        width: 28px;
        height: 28px;
        margin-left: -14px;
        margin-top: -14px;
        border-radius: 50%;
        background: var(--acento);
        opacity: 0;
        transition: opacity 400ms ease;
      }
      #startDot.visible { opacity: 1; }

      /* Cursor guía (emoji) — posicionado y rotado por animation.js */
      #cursorEmoji {
        position: absolute;
        width: 96px;
        height: 96px;
        margin-left: -48px;
        margin-top: -48px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 96px;
        line-height: 1;
        opacity: 0;
        transform-origin: 50% 50%;
        pointer-events: none;
        z-index: 5;
        filter:
          drop-shadow(0 4px 8px rgba(0,0,0,0.95))
          drop-shadow(0 0 32px rgba(255,255,255,0.85))
          drop-shadow(0 0 56px rgba(224,160,26,0.65))
          drop-shadow(0 0 80px rgba(255,255,255,0.35));
      }
      #cursorEmoji.visible { opacity: 1; }

      /* ===== 2. DURANTE (barra inferior) ===== */
      .stats {
        left: 0; right: 0;
        top: 320px;
        height: 160px;
        background: rgba(12,14,18,0.72);
        display: flex;
        align-items: stretch;
        position: absolute;
        box-sizing: border-box;
      }
      /* Regla ámbar borde superior: width dinámico = % ruta recorrida */
      .stats-progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: var(--acento);
      }
      .stat {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .stat-value {
        font-size: 64px;
        font-weight: 600;
        line-height: 1;
        color: var(--texto);
      }
      .stat-label {
        font-size: 26px;
        font-weight: 500;
        line-height: 1;
        color: var(--muted);
      }
      .stats-logo {
        position: absolute;
        top: 8px;
        left: 32px;
        font-size: 26px;
        color: var(--texto);
        opacity: 0.5;
      }

      /* ===== 3. CIERRE (outro) ===== */
      .outro {
        inset: 0;
        background: rgba(12,14,18,0.80);
      }
      .outro-eyebrow {
        position: absolute;
        top: 340px;
        left: 0; right: 0;
      }
      .outro-title-wrap {
        position: absolute;
        left: 32px;
        right: 32px;
        top: 460px;
        text-align: center;
      }
      .outro-title {
        margin: 0;
        font-size: 56px;
        font-weight: 600;
        line-height: 1.15;
        color: var(--texto);
      }
      .outro-date {
        margin-top: 18px;
        font-size: 32px;
        font-weight: 500;
        color: var(--muted);
      }
      .outro-stats {
        position: absolute;
        top: 620px;
        left: 80px; right: 80px;
        height: 380px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      /* Divisores ámbar al 35% */
      .outro-stats::before {
        content: ''; position: absolute;
        left: 50%; top: 60px; bottom: 60px;
        width: 1px; margin-left: -0.5px;
        background: rgba(224,160,26,0.35);
      }
      .outro-stats::after {
        content: ''; position: absolute;
        left: 60px; right: 60px; top: 50%;
        height: 1px; margin-top: -0.5px;
        background: rgba(224,160,26,0.35);
      }
      .outro-stat {
        text-align: center;
        padding-top: 40px;
        position: relative;
      }
      .outro-stat-value {
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        color: var(--texto);
      }
      .outro-stat-label {
        margin-top: 20px;
        font-size: 26px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--muted);
        white-space: nowrap;
      }

      /* ===== 4. ATRIBUCIÓN — dueño de la ruta =====
         Pill flotante debajo del bloque de stats (top-left). El
         stats bar sigue mostrando km/alt/d+; este pill agrega la
         atribución del dueño. Card grande centrada al final. */
      .stats-owner {
        position: absolute;
        top: 500px;
        left: 60px;
        display: flex;
        align-items: center;
        gap: 16px;
        height: 72px;
        padding: 0 28px 0 10px;
        background: rgba(12,14,18,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 999px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      }
      .stats-owner img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        border: 2.5px solid rgba(224,160,26,0.7);
        flex-shrink: 0;
      }
      .stats-owner .name {
        font-size: 30px;
        font-weight: 500;
        color: var(--texto);
        line-height: 1;
      }
      .stats-owner .handle {
        font-size: 30px;
        font-weight: 500;
        color: var(--acento);
        line-height: 1;
      }

      .outro-owner-card {
        position: absolute;
        top: 1130px;
        left: 60px;
        right: 60px;
        height: 200px;
        padding: 24px 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: rgba(12,14,18,0.78);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 28px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.55);
        border: 1px solid rgba(224,160,26,0.25);
      }
      .outro-owner-card img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(224,160,26,0.8);
        flex-shrink: 0;
      }
      .outro-owner-card .text {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 10px;
        min-width: 0;
      }
      .outro-owner-card .label {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .outro-owner-card .name {
        font-size: 44px;
        font-weight: 600;
        color: var(--texto);
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- Círculo de inicio de ruta -->
    <div id="startDot"></div>

    <!-- Cursor guía (emoji por disciplina) -->
    <div id="cursorEmoji"></div>

    <!-- ===== 1. Título ===== -->
    <div id="intro" class="overlay intro">
      <div class="intro-eyebrow eyebrow" id="introEyebrow"></div>
      <div class="intro-title-wrap">
        <h1 class="intro-title" id="introTitle"></h1>
        <div class="intro-date" id="introDate"></div>
      </div>
    </div>

    <!-- ===== 2. Durante ===== -->
    <div id="stats" class="overlay stats">
      <div class="stats-progress" id="statsProgress"></div>
      <div class="stats-logo logo">Rawko</div>
      <div class="stat">
        <div class="stat-value" id="statKm">0.0</div>
        <div class="stat-label">km</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statAlt">0</div>
        <div class="stat-label">m</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statDPlus">+0</div>
        <div class="stat-label">m</div>
      </div>
    </div>

    <!-- Pill de atribución (debajo del stats, top-left) -->
    <div id="statsOwner" class="overlay stats-owner">
      <img id="statsOwnerAvatar" alt="" />
      <span class="name" id="statsOwnerName"></span>
      <span class="handle">· @rawko</span>
    </div>

    <!-- ===== 3. Cierre ===== -->
    <div id="outro" class="overlay outro">
      <div class="outro-eyebrow eyebrow" id="outroEyebrow"></div>
      <div class="outro-title-wrap">
        <h1 class="outro-title" id="outroTitle"></h1>
        <div class="outro-date" id="outroDate"></div>
      </div>
      <div class="outro-stats" id="outroStats">
        <div class="outro-stat">
          <div class="outro-stat-value" id="outroKm">0.0</div>
          <div class="outro-stat-label">km</div>
        </div>
        <div class="outro-stat">
          <div class="outro-stat-value" id="outroDPlus">0</div>
          <div class="outro-stat-label">m</div>
        </div>
        <div class="outro-stat">
          <div class="outro-stat-value" id="outroTime">0h</div>
          <div class="outro-stat-label">tiempo</div>
        </div>
        <div class="outro-stat" id="outroWpsCell">
          <div class="outro-stat-value" id="outroWps">0</div>
          <div class="outro-stat-label" id="outroWpsLabel">hitos</div>
        </div>
      </div>

      <!-- Card grande de atribución al dueño (outro) -->
      <div id="outroOwnerCard" class="outro-owner-card">
        <img id="outroOwnerAvatar" alt="" />
        <div class="text">
          <div class="label">Recorrido creado por</div>
          <div class="name" id="outroOwnerName"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="/animation.js"></script>
  </body>
</html>
