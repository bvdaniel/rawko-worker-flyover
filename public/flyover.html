<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rawko Flyover</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --rawko-green: #15803d;
        --rawko-cream: #f5f1ea;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Inter", "Helvetica Neue", system-ui, sans-serif;
        color: #fff;
        background: #000;
      }
      #map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #1a1a1a;
        z-index: 1;
      }
      /* Canvas para dibujar polyline + cursor. z-index > Leaflet (que usa
         400 internamente para sus panes) para garantizar que la línea
         dorada quede encima de los tiles. Sin esto la polyline se dibujaba
         debajo del mapa y solo se veían cambios de color sutiles. */
      #fxCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 500;
      }
      .overlay { z-index: 700; }
      .outro { z-index: 800; }
      .overlay {
        position: absolute;
        pointer-events: none;
        opacity: 0;
        transition: opacity 600ms ease-in-out;
      }
      .overlay.visible {
        opacity: 1;
      }
      .title-block {
        top: 200px;
        left: 0;
        right: 0;
        text-align: center;
        padding: 0 60px;
      }
      .title-eyebrow {
        font-size: 28px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.92);
        margin-bottom: 24px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }
      .title-main {
        font-family: "Fraunces", "Georgia", serif;
        font-size: 96px;
        line-height: 1.05;
        font-weight: 900;
        color: #fff;
        text-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
        margin: 0;
      }
      .title-sub {
        font-size: 32px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.95);
        margin-top: 28px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      }
      .stats-strip {
        bottom: 140px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: space-around;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(20px);
        border-radius: 28px;
        padding: 28px 24px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .stat { text-align: center; flex: 1; }
      .stat-value {
        font-size: 56px;
        font-weight: 900;
        color: #fff;
        line-height: 1;
      }
      .stat-label {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 10px;
      }
      .waypoint-card {
        bottom: 320px;
        left: 60px;
        right: 60px;
        background: rgba(0, 0, 0, 0.78);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .waypoint-photo {
        width: 200px;
        height: 200px;
        border-radius: 18px;
        object-fit: cover;
        flex-shrink: 0;
        background: #222;
      }
      .waypoint-body { flex: 1; min-width: 0; }
      .waypoint-emoji { font-size: 40px; margin-bottom: 6px; }
      .waypoint-title {
        font-size: 36px;
        font-weight: 800;
        margin: 0 0 8px 0;
        color: #fff;
        line-height: 1.1;
      }
      .waypoint-meta {
        font-size: 22px;
        color: rgba(255, 255, 255, 0.75);
      }
      .outro {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.9) 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 80px;
        opacity: 0;
        transition: opacity 800ms ease-in-out;
      }
      .outro.visible { opacity: 1; }
      .outro-title {
        font-family: "Fraunces", "Georgia", serif;
        font-size: 108px;
        font-weight: 900;
        margin-bottom: 60px;
        line-height: 1;
      }
      .outro-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px 80px;
        margin-bottom: 80px;
        width: 100%;
      }
      .outro-stat-value {
        font-size: 84px;
        font-weight: 900;
        line-height: 1;
      }
      .outro-stat-label {
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 14px;
        font-weight: 700;
      }
      .outro-brand {
        font-family: "Fraunces", "Georgia", serif;
        font-size: 64px;
        font-weight: 900;
        color: var(--rawko-cream);
        letter-spacing: -0.02em;
      }
      .outro-brand-sub {
        font-size: 22px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(245, 241, 234, 0.75);
        margin-top: 8px;
      }
      /* Oscurecer un poco el mapa para que los textos resalten */
      .leaflet-tile-container { filter: brightness(0.78) saturate(1.05); }
      .leaflet-control-attribution { display: none !important; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <canvas id="fxCanvas" width="1080" height="1920"></canvas>

    <div id="title" class="overlay title-block">
      <div class="title-eyebrow" id="titleEyebrow"></div>
      <h1 class="title-main" id="titleMain"></h1>
      <div class="title-sub" id="titleSub"></div>
    </div>

    <div id="stats" class="overlay stats-strip">
      <div class="stat">
        <div class="stat-value" id="statKm">0.0</div>
        <div class="stat-label">km</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statAlt">0</div>
        <div class="stat-label">m alt</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="statGain">0</div>
        <div class="stat-label">D+ m</div>
      </div>
    </div>

    <div id="waypointCard" class="overlay waypoint-card" style="display:none">
      <img id="waypointPhoto" class="waypoint-photo" />
      <div class="waypoint-body">
        <div class="waypoint-emoji" id="waypointEmoji">📍</div>
        <h2 class="waypoint-title" id="waypointTitle"></h2>
        <div class="waypoint-meta" id="waypointMeta"></div>
      </div>
    </div>

    <div id="outro" class="outro">
      <div class="outro-title" id="outroTitle"></div>
      <div class="outro-stats">
        <div>
          <div class="outro-stat-value" id="outroKm">0.0</div>
          <div class="outro-stat-label">kilómetros</div>
        </div>
        <div>
          <div class="outro-stat-value" id="outroGain">0</div>
          <div class="outro-stat-label">d+ metros</div>
        </div>
        <div>
          <div class="outro-stat-value" id="outroTime">0h</div>
          <div class="outro-stat-label">tiempo</div>
        </div>
        <div>
          <div class="outro-stat-value" id="outroWps">0</div>
          <div class="outro-stat-label">hitos</div>
        </div>
      </div>
      <div class="outro-brand">Rawko</div>
      <div class="outro-brand-sub">rawko.io</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/animation.js"></script>
  </body>
</html>
